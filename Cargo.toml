[package]
name = "zoom-downloader"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.9"
tokio = { version = "1.42", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
anyhow = "1.0"
indicatif = "0.17"
futures = "0.3"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
slint-build = "1.9"
