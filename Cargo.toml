[package]
name = "zoom-downloader"
version = "1.0.0"
edition = "2021"
description = "Bulk download (and optionally clean up) Zoom cloud recordings"
publish = false

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
futures = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
log = { version = "0.4", features = ["std"] }
open = "5"
percent-encoding = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "1.14", features = ["unstable-winit-030"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tokio-util = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[build-dependencies]
slint-build = "1.14"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
